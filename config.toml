[llm]
# "openai_compat" or "ollama"
backend = "openai_compat"
temperature = 0.0
timeout_s = 120

[llm.openai_compat]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3.5-flash"
api_key_env = "GEMINI_API_KEY"

[llm.ollama]
base_url = "http://localhost:11434"
model = "qwen2.5:3b"

[github]
repo = "minte-sys/triagebot-sandbox"
allowed_repos = ["minte-sys/triagebot-sandbox"]
token_env = "GITHUB_TOKEN"

[search]
db_path = "data/triagebot.db"
# Markdown docs to index; a local clone of the sandbox repo
docs_dir = "../triagebot-sandbox/docs"

[agent]
max_steps = 8
max_seconds = 300
max_tokens = 40000
# "native" uses the model's tool calling; "json" asks for tool calls as JSON text
tool_mode = "native"
# which system prompt to use; older versions are kept so eval results can be compared
prompt_version = "v3"

[safety]
# true: review shows what would happen but writes nothing to GitHub
dry_run = true

[trust]
# false: every proposal waits for review, even for action types that earned auto mode
auto_enabled = false
# promote an action type after min_decisions reviews, if min_approval_pct of the
# last `window` were approved unchanged
min_decisions = 20
window = 20
min_approval_pct = 90
# in auto mode, hold every audit_every-th action for review; demote if fewer than
# min_audit_accuracy_pct of the last audit_window audits passed (once there are min_audits)
audit_every = 5
audit_window = 10
min_audits = 5
min_audit_accuracy_pct = 80

[embeddings]
# uses the URL and key from [llm.<backend>]; --backend overrides it like it does for [llm]
backend = "openai_compat"

[embeddings.openai_compat]
model = "gemini-embedding-001"

[embeddings.ollama]
model = "nomic-embed-text"
