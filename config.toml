[llm]
# "openai_compat" or "ollama"
backend = "openai_compat"
temperature = 0.0
timeout_s = 120

[llm.openai_compat]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3.8-flash"
api_key_env = "GEMINI_API_KEY"

[llm.ollama]
base_url = "http://localhost:11434"
model = "qwen2.5:3b"

[github]
repo = "minte-sys/triagebot-sandbox"
allowed_repos = ["minte-sys/triagebot-sandbox"]
token_env = "GITHUB_TOKEN"

[search]
db_path = "data/triagebot.db"
# Markdown docs to index; a local clone of the sandbox repo
docs_dir = "../triagebot-sandbox/docs"

[agent]
max_steps = 8
max_seconds = 300
max_tokens = 40000
# "native" uses the model's tool calling; "json" asks for tool calls as JSON text
tool_mode = "native"

[safety]
# true: review shows what would happen but writes nothing to GitHub
dry_run = true
